name: Build news feed
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-feed.mjs'
      - '.github/workflows/news.yml'
permissions:
  contents: write
concurrency:
  group: news-feed
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i rss-parser@3 --no-save
      - run: node scripts/build-feed.mjs
      - name: Commit feed
        run: |
          git config user.name "news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet && exit 0
          git commit -m "Update news feed [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break || sleep 5
          done
